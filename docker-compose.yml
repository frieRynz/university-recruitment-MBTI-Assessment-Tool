services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mbti
      POSTGRES_PASSWORD: mbti_secret
      POSTGRES_DB: mbti_db
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mbti -d mbti_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      target: migrator
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://mbti:mbti_secret@db:5432/mbti_db?schema=public

  web:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://mbti:mbti_secret@db:5432/mbti_db?schema=public
      AUTH_SECRET: change-me-to-a-long-random-string
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NODE_ENV: production
    ports:
      - "3000:3000"

  # Web-based database GUI — http://localhost:8080
  # System: PostgreSQL, Server: db, User: mbti, Password: mbti_secret, Database: mbti_db
  adminer:
    image: adminer:6.0.1
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - "8080:8080"

volumes:
  pgdata:
